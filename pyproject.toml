[project]
name = "add-work"
version = "2.0.0"
description = "工时填报工具（FastAPI + MCP）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "httpx>=0.25.0",
    "openai>=2.13.0",
    "python-dotenv>=1.0.0",
    "sqlite-web>=0.8.0",
    "fastmcp>=2.12.0,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 聚焦正确性问题与代码整洁；UP（pyupgrade）会触发全项目类型注解风格迁移，暂不启用
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # 行宽由 formatter 处理
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
